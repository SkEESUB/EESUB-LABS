<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="100%" stop-color="#181330" />
    </linearGradient>
    <linearGradient id="purple-btn3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="card-bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" rx="16" fill="url(#bg3)" />

  <!-- Sidebar -->
  <g transform="translate(0, 0)">
    <rect width="210" height="750" fill="#130f28" />
    <line x1="210" y1="0" x2="210" y2="750" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <g transform="translate(24, 30)">
      <rect width="36" height="36" rx="10" fill="url(#purple-btn3)" />
      <text x="18" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">B</text>
      <text x="48" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">BillBuddy</text>
    </g>
    <g transform="translate(18, 100)" font-family="system-ui, sans-serif" font-size="13.5" font-weight="500">
      <text x="38" y="25" fill="#9ca3af">Dashboard</text>
      <circle cx="22" cy="20" r="4" fill="#6b7280" />
      <g transform="translate(0, 52)">
        <text x="38" y="25" fill="#9ca3af">Bills</text>
        <circle cx="22" cy="20" r="4" fill="#6b7280" />
      </g>
      <!-- Active Item: Transactions -->
      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="174" height="40" rx="10" fill="rgba(139, 92, 246, 0.22)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
        <circle cx="22" cy="20" r="6" fill="#a855f7" />
        <text x="38" y="25" fill="#ffffff" font-weight="600">Transactions</text>
      </g>
      <g transform="translate(0, 156)">
        <text x="38" y="25" fill="#9ca3af">Budgets</text>
        <circle cx="22" cy="20" r="4" fill="#6b7280" />
      </g>
      <g transform="translate(0, 208)">
        <text x="38" y="25" fill="#9ca3af">Insights</text>
        <circle cx="22" cy="20" r="4" fill="#6b7280" />
      </g>
    </g>
  </g>

  <!-- Main Content -->
  <g transform="translate(240, 28)" font-family="system-ui, sans-serif">
    <!-- Header -->
    <g>
      <text x="0" y="24" fill="#ffffff" font-size="24" font-weight="700">Transaction History</text>
      <text x="0" y="46" fill="#9ca3af" font-size="13">Real-time ledger with pagination, tags and export capabilities</text>
      
      <!-- Export & Filter Controls -->
      <g transform="translate(680, 0)">
        <rect width="105" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="52" y="22" fill="#e5e7eb" font-size="12" font-weight="500" text-anchor="middle">Filter By ▼</text>
        
        <g transform="translate(115, 0)">
          <rect width="110" height="36" rx="18" fill="url(#purple-btn3)" />
          <text x="55" y="22" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Export CSV</text>
        </g>
      </g>
    </g>

    <!-- Search bar -->
    <g transform="translate(0, 75)">
      <rect width="900" height="46" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="20" y="28" fill="#6b7280" font-size="13">🔍 Search transactions by merchant, category or account...</text>
    </g>

    <!-- Transaction Table Header -->
    <g transform="translate(0, 140)" font-size="12" font-weight="600" fill="#9ca3af">
      <text x="20" y="0">TRANSACTION / MERCHANT</text>
      <text x="360" y="0">CATEGORY</text>
      <text x="540" y="0">DATE &amp; TIME</text>
      <text x="720" y="0">STATUS</text>
      <text x="880" y="0" text-anchor="end">AMOUNT</text>
      <line x1="0" y1="14" x2="900" y2="14" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    </g>

    <!-- Transaction Rows -->
    <g transform="translate(0, 175)" font-size="13.5">
      <!-- Row 1 -->
      <g>
        <rect width="900" height="64" rx="10" fill="url(#card-bg3)" stroke="rgba(255,255,255,0.04)" />
        <circle cx="35" cy="32" r="16" fill="rgba(52, 211, 153, 0.15)" />
        <text x="35" y="37" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">💼</text>
        <text x="65" y="28" fill="#ffffff" font-weight="600">Client Consulting Payout</text>
        <text x="65" y="46" fill="#9ca3af" font-size="11.5">Direct Deposit · Bank Transfer</text>
        <text x="360" y="37" fill="#e5e7eb">Income / Freelance</text>
        <text x="540" y="37" fill="#9ca3af" font-size="12">Today, 2:45 PM</text>
        <text x="720" y="37" fill="#34d399" font-weight="600">Settled</text>
        <text x="880" y="37" fill="#34d399" font-weight="700" text-anchor="end">+₹65,000</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 74)">
        <rect width="900" height="64" rx="10" fill="url(#card-bg3)" stroke="rgba(255,255,255,0.04)" />
        <circle cx="35" cy="32" r="16" fill="rgba(244, 63, 94, 0.15)" />
        <text x="35" y="37" fill="#f43f5e" font-size="14" font-weight="700" text-anchor="middle">🛒</text>
        <text x="65" y="28" fill="#ffffff" font-weight="600">Nature Basket Supermarket</text>
        <text x="65" y="46" fill="#9ca3af" font-size="11.5">Groceries · UPI / PhonePe</text>
        <text x="360" y="37" fill="#e5e7eb">Food &amp; Dining</text>
        <text x="540" y="37" fill="#9ca3af" font-size="12">Yesterday, 7:15 PM</text>
        <text x="720" y="37" fill="#34d399" font-weight="600">Settled</text>
        <text x="880" y="37" fill="#f87171" font-weight="700" text-anchor="end">-₹2,340</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 148)">
        <rect width="900" height="64" rx="10" fill="url(#card-bg3)" stroke="rgba(255,255,255,0.04)" />
        <circle cx="35" cy="32" r="16" fill="rgba(168, 85, 247, 0.15)" />
        <text x="35" y="37" fill="#a855f7" font-size="14" font-weight="700" text-anchor="middle">⚡</text>
        <text x="65" y="28" fill="#ffffff" font-weight="600">BSES Power Utilities</text>
        <text x="65" y="46" fill="#9ca3af" font-size="11.5">Electricity Bill · Auto-Pay Scheduled</text>
        <text x="360" y="37" fill="#e5e7eb">Bills &amp; Utilities</text>
        <text x="540" y="37" fill="#9ca3af" font-size="12">July 4, 11:20 AM</text>
        <text x="720" y="37" fill="#fbbf24" font-weight="600">Pending Due</text>
        <text x="880" y="37" fill="#f87171" font-weight="700" text-anchor="end">-₹1,850</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 222)">
        <rect width="900" height="64" rx="10" fill="url(#card-bg3)" stroke="rgba(255,255,255,0.04)" />
        <circle cx="35" cy="32" r="16" fill="rgba(6, 182, 212, 0.15)" />
        <text x="35" y="37" fill="#06b6d4" font-size="14" font-weight="700" text-anchor="middle">🚕</text>
        <text x="65" y="28" fill="#ffffff" font-weight="600">Uber Commute Ride</text>
        <text x="65" y="46" fill="#9ca3af" font-size="11.5">Airport Transit · Credit Card</text>
        <text x="360" y="37" fill="#e5e7eb">Travel &amp; Fuel</text>
        <text x="540" y="37" fill="#9ca3af" font-size="12">July 3, 9:05 AM</text>
        <text x="720" y="37" fill="#34d399" font-weight="600">Settled</text>
        <text x="880" y="37" fill="#f87171" font-weight="700" text-anchor="end">-₹480</text>
      </g>

      <!-- Row 5 -->
      <g transform="translate(0, 296)">
        <rect width="900" height="64" rx="10" fill="url(#card-bg3)" stroke="rgba(255,255,255,0.04)" />
        <circle cx="35" cy="32" r="16" fill="rgba(245, 158, 11, 0.15)" />
        <text x="35" y="37" fill="#f59e0b" font-size="14" font-weight="700" text-anchor="middle">☕</text>
        <text x="65" y="28" fill="#ffffff" font-weight="600">Blue Tokai Coffee Roasters</text>
        <text x="65" y="46" fill="#9ca3af" font-size="11.5">Workspace &amp; Refreshments</text>
        <text x="360" y="37" fill="#e5e7eb">Food &amp; Dining</text>
        <text x="540" y="37" fill="#9ca3af" font-size="12">July 2, 4:30 PM</text>
        <text x="720" y="37" fill="#34d399" font-weight="600">Settled</text>
        <text x="880" y="37" fill="#f87171" font-weight="700" text-anchor="end">-₹320</text>
      </g>
    </g>

    <!-- Pagination Footer -->
    <g transform="translate(0, 560)">
      <text x="0" y="20" fill="#9ca3af" font-size="12">Showing 1 to 5 of 68 transactions</text>
      <g transform="translate(730, 0)">
        <rect width="80" height="30" rx="8" fill="rgba(255,255,255,0.06)" />
        <text x="40" y="19" fill="#9ca3af" font-size="11.5" text-anchor="middle">Previous</text>
        <g transform="translate(88, 0)">
          <rect width="80" height="30" rx="8" fill="url(#purple-btn3)" />
          <text x="40" y="19" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Next ➔</text>
        </g>
      </g>
    </g>
  </g>
</svg>