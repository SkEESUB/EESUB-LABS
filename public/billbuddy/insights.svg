<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="100%" stop-color="#181330" />
    </linearGradient>
    <linearGradient id="purple-btn5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="card-bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <linearGradient id="line-trend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" rx="16" fill="url(#bg5)" />

  <!-- Sidebar -->
  <g transform="translate(0, 0)">
    <rect width="210" height="750" fill="#130f28" />
    <line x1="210" y1="0" x2="210" y2="750" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <g transform="translate(24, 30)">
      <rect width="36" height="36" rx="10" fill="url(#purple-btn5)" />
      <text x="18" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">B</text>
      <text x="48" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">BillBuddy</text>
    </g>
    <g transform="translate(18, 100)" font-family="system-ui, sans-serif" font-size="13.5" font-weight="500">
      <text x="38" y="25" fill="#9ca3af">Dashboard</text>
      <circle cx="22" cy="20" r="4" fill="#6b7280" />
      <g transform="translate(0, 52)">
        <text x="38" y="25" fill="#9ca3af">Bills</text>
        <circle cx="22" cy="20" r="4" fill="#6b7280" />
      </g>
      <g transform="translate(0, 104)">
        <text x="38" y="25" fill="#9ca3af">Transactions</text>
        <circle cx="22" cy="20" r="4" fill="#6b7280" />
      </g>
      <g transform="translate(0, 156)">
        <text x="38" y="25" fill="#9ca3af">Budgets</text>
        <circle cx="22" cy="20" r="4" fill="#6b7280" />
      </g>
      <!-- Active Item: Insights -->
      <g transform="translate(0, 208)">
        <rect x="0" y="0" width="174" height="40" rx="10" fill="rgba(139, 92, 246, 0.22)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
        <circle cx="22" cy="20" r="6" fill="#a855f7" />
        <text x="38" y="25" fill="#ffffff" font-weight="600">Insights</text>
      </g>
    </g>
  </g>

  <!-- Main Content -->
  <g transform="translate(240, 28)" font-family="system-ui, sans-serif">
    <!-- Header -->
    <g>
      <text x="0" y="24" fill="#ffffff" font-size="24" font-weight="700">Financial Insights &amp; Projections</text>
      <text x="0" y="46" fill="#9ca3af" font-size="13">Recharts-powered visual analytics and spending trajectory</text>
    </g>

    <!-- Cashflow Analysis Waveform -->
    <g transform="translate(0, 75)">
      <rect width="900" height="280" rx="16" fill="url(#card-bg5)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="28" y="36" fill="#ffffff" font-size="16" font-weight="700">6-Month Cash Flow &amp; Savings Rate</text>
      <text x="860" y="36" fill="#34d399" font-size="13" font-weight="700" text-anchor="end">Avg Savings: 34.2%</text>

      <!-- Curve Chart -->
      <g transform="translate(50, 40)">
        <line x1="0" y1="180" x2="800" y2="180" stroke="rgba(255,255,255,0.08)" />
        <line x1="0" y1="120" x2="800" y2="120" stroke="rgba(255,255,255,0.08)" />
        <line x1="0" y1="60" x2="800" y2="60" stroke="rgba(255,255,255,0.08)" />

        <path d="M 40 150 Q 160 80, 280 130 T 520 70 T 760 40" fill="none" stroke="url(#line-trend)" stroke-width="4" stroke-linecap="round" />
        
        <circle cx="40" cy="150" r="6" fill="#818cf8" stroke="#ffffff" stroke-width="2" />
        <circle cx="280" cy="130" r="6" fill="#a855f7" stroke="#ffffff" stroke-width="2" />
        <circle cx="520" cy="70" r="6" fill="#c084fc" stroke="#ffffff" stroke-width="2" />
        <circle cx="760" cy="40" r="7" fill="#34d399" stroke="#ffffff" stroke-width="2.5" />

        <text x="40" y="205" fill="#9ca3af" font-size="11.5" text-anchor="middle">Jan</text>
        <text x="180" y="205" fill="#9ca3af" font-size="11.5" text-anchor="middle">Feb</text>
        <text x="320" y="205" fill="#9ca3af" font-size="11.5" text-anchor="middle">Mar</text>
        <text x="460" y="205" fill="#9ca3af" font-size="11.5" text-anchor="middle">Apr</text>
        <text x="600" y="205" fill="#9ca3af" font-size="11.5" text-anchor="middle">May</text>
        <text x="740" y="205" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">Jun</text>
      </g>
    </g>

    <!-- Key Insights Recommendations Grid -->
    <g transform="translate(0, 380)">
      <!-- Card 1 -->
      <g>
        <rect width="435" height="170" rx="14" fill="url(#card-bg5)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <circle cx="40" cy="38" r="16" fill="rgba(52, 211, 153, 0.2)" />
        <text x="40" y="44" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">✓</text>
        <text x="72" y="42" fill="#ffffff" font-size="15" font-weight="700">Zero Unsettled Variance</text>
        <text x="24" y="80" fill="#9ca3af" font-size="12.5" width="380">
          All multi-account transfers reconciled automatically. Ledger balance matches bank verification records.
        </text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(465, 0)">
        <rect width="435" height="170" rx="14" fill="url(#card-bg5)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <circle cx="40" cy="38" r="16" fill="rgba(168, 85, 247, 0.2)" />
        <text x="40" y="44" fill="#c084fc" font-size="16" font-weight="700" text-anchor="middle">💡</text>
        <text x="72" y="42" fill="#ffffff" font-size="15" font-weight="700">Subscription Audit Recommendation</text>
        <text x="24" y="80" fill="#9ca3af" font-size="12.5" width="380">
          Identified 2 overlapping streaming and cloud tiers. Potential annual savings of ₹8,400 if consolidated.
        </text>
      </g>
    </g>
  </g>
</svg>