<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0914" />
      <stop offset="40%" stop-color="#141126" />
      <stop offset="70%" stop-color="#181333" />
      <stop offset="100%" stop-color="#0D0B18" />
    </linearGradient>

    <radialGradient id="indigo-glow" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple-glow" cx="75%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan-glow" cx="60%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glass-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.03)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <linearGradient id="glass-card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.35)" />
      <stop offset="35%" stop-color="rgba(129, 140, 248, 0.45)" />
      <stop offset="70%" stop-color="rgba(192, 132, 252, 0.35)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.15)" />
    </linearGradient>

    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="chart-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="chart-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Deep Background Canvas -->
  <rect width="1600" height="1000" fill="url(#bg-grad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="360" cy="320" r="420" fill="url(#indigo-glow)" filter="url(#blur-glow)" />
  <circle cx="1200" cy="680" r="480" fill="url(#purple-glow)" filter="url(#blur-glow)" />
  <circle cx="950" cy="220" r="320" fill="url(#cyan-glow)" filter="url(#blur-glow)" />

  <!-- Technical Grid Overlay -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" />
    </pattern>
    <rect width="1600" height="1000" fill="url(#grid)" />
  </g>

  <!-- Specular Glow Concentric Rings -->
  <g opacity="0.12" stroke="#818CF8" stroke-width="1.5">
    <circle cx="800" cy="500" r="380" stroke-dasharray="8 12" />
    <circle cx="800" cy="500" r="460" stroke-dasharray="4 8" />
  </g>

  <!-- Centerpiece Glassmorphic Dashboard Showcase Card -->
  <g filter="url(#soft-shadow)">
    <!-- Glass Backdrop -->
    <rect x="260" y="150" width="1080" height="700" rx="32" fill="url(#glass-card-bg)" stroke="url(#glass-card-border)" stroke-width="1.5" />

    <!-- Top Window Chrome / Header Bar -->
    <g transform="translate(300, 190)">
      <!-- Window Controls -->
      <circle cx="14" cy="14" r="6" fill="#EF4444" opacity="0.8" />
      <circle cx="34" cy="14" r="6" fill="#F59E0B" opacity="0.8" />
      <circle cx="54" cy="14" r="6" fill="#10B981" opacity="0.8" />

      <!-- Center Route Pill -->
      <rect x="360" y="0" width="280" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="500" y="18" fill="rgba(255, 255, 255, 0.6)" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="1" text-anchor="middle">
        bill-buddy-liart.vercel.app
      </text>

      <!-- Live Indicator on Right -->
      <g transform="translate(930, 4)">
        <rect x="0" y="0" width="68" height="22" rx="11" fill="rgba(16, 185, 129, 0.16)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1" />
        <circle cx="12" cy="11" r="3.5" fill="#34D399" />
        <text x="38" y="15" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5" text-anchor="middle">LIVE</text>
      </g>
    </g>

    <!-- Divider Line -->
    <line x1="260" y1="240" x2="1340" y2="240" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Main Hero Brand Core -->
    <g transform="translate(800, 360)" text-anchor="middle">
      <!-- Floating App Icon with Ambient Glow -->
      <g transform="translate(0, -40)">
        <circle cx="0" cy="0" r="54" fill="url(#logo-grad)" filter="drop-shadow(0 14px 28px rgba(99, 102, 241, 0.5))" />
        <!-- Finance Bill & Sparkle Glyphs -->
        <path d="M-18 -14 C-18 -18, -14 -22, -10 -22 L10 -22 C14 -22, 18 -18, 18 -14 L18 14 C18 18, 14 22, 10 22 L-10 22 C-14 22, -18 18, -18 14 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
        <path d="M-10 -11 L10 -11 M-10 -4 L10 -4 M-10 3 L4 3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
        <circle cx="11" cy="11" r="4.5" fill="#34D399" />
        <!-- Floating sparkle -->
        <path d="M26 -28 L28 -22 L34 -20 L28 -18 L26 -12 L24 -18 L18 -20 L24 -22 Z" fill="#FDE047" opacity="0.9" />
      </g>

      <!-- App Title -->
      <text y="64" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" letter-spacing="-1">
        BillBuddy
      </text>

      <!-- Subtitle -->
      <text y="104" fill="rgba(255, 255, 255, 0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="500" letter-spacing="0.2">
        Smart Bill &amp; Personal Expense Management Platform
      </text>

      <text y="132" fill="rgba(192, 132, 252, 0.9)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="2" text-transform="uppercase">
        Full-Stack SaaS Application
      </text>

      <!-- Feature Pill Badges -->
      <g transform="translate(0, 168)">
        <g transform="translate(-320, 0)">
          <rect x="0" y="0" width="148" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
          <text x="74" y="20" fill="rgba(255, 255, 255, 0.8)" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Smart Bill Tracking</text>
        </g>
        <g transform="translate(-155, 0)">
          <rect x="0" y="0" width="150" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
          <text x="75" y="20" fill="rgba(255, 255, 255, 0.8)" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Recurring Schedules</text>
        </g>
        <g transform="translate(12, 0)">
          <rect x="0" y="0" width="148" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
          <text x="74" y="20" fill="rgba(255, 255, 255, 0.8)" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Budget Analytics</text>
        </g>
        <g transform="translate(178, 0)">
          <rect x="0" y="0" width="144" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
          <text x="72" y="20" fill="rgba(255, 255, 255, 0.8)" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Supabase RLS</text>
        </g>
      </g>
    </g>

    <!-- Bottom Financial Analytics Waveform Silhouette -->
    <g transform="translate(260, 640)">
      <path d="M 0 120 Q 140 60, 260 90 T 540 60 T 800 110 T 960 40 L 1080 70 L 1080 210 L 0 210 Z" fill="url(#chart-area)" opacity="0.6" />
      <path d="M 0 120 Q 140 60, 260 90 T 540 60 T 800 110 T 960 40 L 1080 70" fill="none" stroke="url(#chart-line)" stroke-width="3" />

      <!-- Interactive Data Points -->
      <circle cx="260" cy="90" r="5" fill="#818CF8" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="540" cy="60" r="5" fill="#A78BFA" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="960" cy="40" r="6" fill="#34D399" stroke="#FFFFFF" stroke-width="2.5" />
    </g>

    <!-- Replacement Ready Information Banner at Card Foot -->
    <g transform="translate(800, 805)" text-anchor="middle">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="rgba(15, 14, 23, 0.85)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
      <text y="5" fill="#A5B4FC" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.4">
        ✦ Screenshots coming soon · Live demo available
      </text>
    </g>
  </g>
</svg>
