<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="100%" stop-color="#181330" />
    </linearGradient>
    <linearGradient id="purple-btn2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="card-bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" rx="16" fill="url(#bg2)" />

  <!-- Sidebar -->
  <g transform="translate(0, 0)">
    <rect width="210" height="750" fill="#130f28" />
    <line x1="210" y1="0" x2="210" y2="750" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <g transform="translate(24, 30)">
      <rect width="36" height="36" rx="10" fill="url(#purple-btn2)" />
      <text x="18" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">B</text>
      <text x="48" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">BillBuddy</text>
    </g>
    <g transform="translate(18, 100)" font-family="system-ui, sans-serif" font-size="13.5" font-weight="500">
      <text x="38" y="25" fill="#9ca3af">Dashboard</text>
      <circle cx="22" cy="20" r="4" fill="#6b7280" />
      <!-- Active Item: Bills -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="174" height="40" rx="10" fill="rgba(139, 92, 246, 0.22)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
        <circle cx="22" cy="20" r="6" fill="#a855f7" />
        <text x="38" y="25" fill="#ffffff" font-weight="600">Bills</text>
      </g>
      <g transform="translate(0, 104)">
        <text x="38" y="25" fill="#9ca3af">Transactions</text>
        <circle cx="22" cy="20" r="4" fill="#6b7280" />
      </g>
      <g transform="translate(0, 156)">
        <text x="38" y="25" fill="#9ca3af">Budgets</text>
        <circle cx="22" cy="20" r="4" fill="#6b7280" />
      </g>
      <g transform="translate(0, 208)">
        <text x="38" y="25" fill="#9ca3af">Insights</text>
        <circle cx="22" cy="20" r="4" fill="#6b7280" />
      </g>
    </g>
  </g>

  <!-- Main Content -->
  <g transform="translate(240, 28)" font-family="system-ui, sans-serif">
    <!-- Header -->
    <g>
      <text x="0" y="24" fill="#ffffff" font-size="24" font-weight="700">Recurring Bills &amp; Subscriptions</text>
      <text x="0" y="46" fill="#9ca3af" font-size="13">Automated payment schedules with month-end date validation</text>
      
      <g transform="translate(730, 0)">
        <rect width="170" height="38" rx="19" fill="url(#purple-btn2)" />
        <text x="85" y="24" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">+ Add New Bill</text>
      </g>
    </g>

    <!-- Bills Summary Metrics -->
    <g transform="translate(0, 75)">
      <rect width="900" height="80" rx="14" fill="url(#card-bg2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <g transform="translate(30, 24)">
        <text x="0" y="14" fill="#9ca3af" font-size="12">Total Monthly Commitments</text>
        <text x="0" y="42" fill="#ffffff" font-size="20" font-weight="700">₹14,849 / mo</text>
      </g>
      <line x1="280" y1="16" x2="280" y2="64" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <g transform="translate(310, 24)">
        <text x="0" y="14" fill="#9ca3af" font-size="12">Upcoming Due (7 Days)</text>
        <text x="0" y="42" fill="#f87171" font-size="20" font-weight="700">3 Bills (₹4,200)</text>
      </g>
      <line x1="560" y1="16" x2="560" y2="64" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <g transform="translate(590, 24)">
        <text x="0" y="14" fill="#9ca3af" font-size="12">Auto-Pay Enabled</text>
        <text x="0" y="42" fill="#34d399" font-size="20" font-weight="700">5 Services Active</text>
      </g>
    </g>

    <!-- Bills Cards List -->
    <g transform="translate(0, 180)">
      <!-- Item 1: Fiber Internet -->
      <g>
        <rect width="900" height="90" rx="14" fill="url(#card-bg2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <circle cx="45" cy="45" r="22" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1" />
        <text x="45" y="50" fill="#06b6d4" font-size="15" font-weight="700" text-anchor="middle">⚡</text>
        
        <text x="85" y="38" fill="#ffffff" font-size="16" font-weight="600">Airtel Xstream Fiber</text>
        <text x="85" y="58" fill="#9ca3af" font-size="12">Internet · Auto-renews on the 10th</text>
        
        <g transform="translate(480, 32)">
          <rect width="96" height="26" rx="13" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
          <text x="48" y="17" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">Due in 3 days</text>
        </g>
        
        <text x="860" y="44" fill="#ffffff" font-size="20" font-weight="700" text-anchor="end">₹1,179</text>
        <text x="860" y="62" fill="#9ca3af" font-size="11" text-anchor="end">Monthly</text>
      </g>

      <!-- Item 2: Cloud Platform -->
      <g transform="translate(0, 105)">
        <rect width="900" height="90" rx="14" fill="url(#card-bg2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <circle cx="45" cy="45" r="22" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1" />
        <text x="45" y="50" fill="#a855f7" font-size="15" font-weight="700" text-anchor="middle">☁</text>
        
        <text x="85" y="38" fill="#ffffff" font-size="16" font-weight="600">Vercel &amp; Supabase Pro</text>
        <text x="85" y="58" fill="#9ca3af" font-size="12">Developer Infrastructure · Recurring Monthly</text>
        
        <g transform="translate(480, 32)">
          <rect width="104" height="26" rx="13" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" />
          <text x="52" y="17" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Auto-Pay Active</text>
        </g>
        
        <text x="860" y="44" fill="#ffffff" font-size="20" font-weight="700" text-anchor="end">₹3,450</text>
        <text x="860" y="62" fill="#9ca3af" font-size="11" text-anchor="end">Monthly</text>
      </g>

      <!-- Item 3: House Rent -->
      <g transform="translate(0, 210)">
        <rect width="900" height="90" rx="14" fill="url(#card-bg2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <circle cx="45" cy="45" r="22" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1" />
        <text x="45" y="50" fill="#f43f5e" font-size="15" font-weight="700" text-anchor="middle">🏠</text>
        
        <text x="85" y="38" fill="#ffffff" font-size="16" font-weight="600">Apartment Rent &amp; Maintenance</text>
        <text x="85" y="58" fill="#9ca3af" font-size="12">Housing · Bank Transfer</text>
        
        <g transform="translate(480, 32)">
          <rect width="84" height="26" rx="13" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
          <text x="42" y="17" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle">Paid this cycle</text>
        </g>
        
        <text x="860" y="44" fill="#ffffff" font-size="20" font-weight="700" text-anchor="end">₹10,000</text>
        <text x="860" y="62" fill="#9ca3af" font-size="11" text-anchor="end">Monthly</text>
      </g>

      <!-- Item 4: Electricity Bill -->
      <g transform="translate(0, 315)">
        <rect width="900" height="90" rx="14" fill="url(#card-bg2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <circle cx="45" cy="45" r="22" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1" />
        <text x="45" y="50" fill="#f59e0b" font-size="15" font-weight="700" text-anchor="middle">💡</text>
        
        <text x="85" y="38" fill="#ffffff" font-size="16" font-weight="600">Electricity Board Utility</text>
        <text x="85" y="58" fill="#9ca3af" font-size="12">Utilities · Variable monthly consumption</text>
        
        <g transform="translate(480, 32)">
          <rect width="96" height="26" rx="13" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
          <text x="48" y="17" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">Due in 5 days</text>
        </g>
        
        <text x="860" y="44" fill="#ffffff" font-size="20" font-weight="700" text-anchor="end">₹2,850</text>
        <text x="860" y="62" fill="#9ca3af" font-size="11" text-anchor="end">Monthly</text>
      </g>
    </g>
  </g>
</svg>